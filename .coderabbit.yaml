# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop

  path_instructions:
    - path: "src/models/**"
      instructions: |
        Review Mongoose schema definitions for:
        - Proper field validation and constraints
        - Appropriate indexes
        - Pre/post hooks correctness
        - Password field security (select: false)

    - path: "src/middleware/**"
      instructions: |
        Review middleware for:
        - Proper error propagation with next()
        - JWT token extraction from cookies AND headers
        - Role-based access control correctness
        - Validation completeness

    - path: "src/controllers/**"
      instructions: |
        Review controllers for:
        - Proper async/await error handling with try/catch
        - Authorization checks (ownership verification)
        - Correct HTTP status codes
        - Input sanitization before database queries

    - path: "src/routes/**"
      instructions: |
        Review routes for:
        - Correct middleware chain ordering
        - Route parameter validation
        - Proper HTTP method usage

chat:
  auto_reply: true

tone_instructions: "Be constructive and educational. This is a student project."

knowledge_base:
  learnings:
    scope: auto
